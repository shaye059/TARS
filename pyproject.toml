[project]
name = "tars"
version = "0.1.0"
description = "Thinking And Reasoning System"
authors = [
    {name = "Spencer",email = "spencer.hayes.laverdiere@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain (>=0.3.14,<0.4.0)",
    "bitsandbytes (>=0.45.0,<0.46.0)",
    "torch (>=2.5.1,<3.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "transformers (>=4.48.0,<5.0.0)",
    "accelerate (>=1.2.1,<2.0.0)",
    "setuptools (>=75.8.0,<76.0.0)",
    "langchain-community (>=0.3.14,<0.4.0)",
    "sentence-transformers (>=3.3.1,<4.0.0)",
    "chromadb (>=0.6.2,<0.7.0)",
    "langchain-ollama (>=0.2.2,<0.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
